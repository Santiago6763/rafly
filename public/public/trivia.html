<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFLY — Trivia Quiz</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060614;--surface:#0d0d2b;--border:rgba(255,255,255,.06);--text:#e0e0e8;--text-muted:#8888a8;--text-dim:#5a5a7a;--neon-cyan:#00e5ff;--neon-pink:#ff00aa;--neon-green:#39ff14;--gold:#ffd700}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;overflow-x:hidden}
.back-link{position:fixed;top:1rem;left:1rem;color:var(--text-muted);text-decoration:none;font-size:.8rem;z-index:100;display:flex;align-items:center;gap:.3rem;transition:color .2s}
.back-link:hover{color:var(--neon-cyan)}
.container{max-width:700px;margin:0 auto;padding:2rem 1rem}
h1{font-family:'Orbitron',monospace;font-size:1.8rem;text-align:center;color:var(--neon-cyan);margin-bottom:.3rem}
.subtitle{text-align:center;color:var(--text-muted);font-size:.85rem;margin-bottom:2rem}

/* Setup form */
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.setup-card h2{font-family:'Orbitron',monospace;font-size:1rem;color:var(--gold);margin-bottom:1rem}
.field{margin-bottom:.8rem}
.field label{display:block;font-size:.75rem;color:var(--text-muted);margin-bottom:.3rem;font-weight:600}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.5rem .7rem;border-radius:8px;font-family:inherit;font-size:.85rem;outline:none;transition:border-color .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--neon-cyan)}

.question-block{background:rgba(0,229,255,.03);border:1px solid rgba(0,229,255,.1);border-radius:10px;padding:1rem;margin-bottom:.8rem;position:relative}
.question-block .q-num{font-family:'Orbitron',monospace;font-size:.7rem;color:var(--neon-cyan);margin-bottom:.5rem}
.question-block .remove-q{position:absolute;top:.5rem;right:.5rem;background:none;border:none;color:#ff5252;cursor:pointer;font-size:1.1rem;line-height:1}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.5rem}
.options-grid input{font-size:.78rem;padding:.4rem .5rem}
.correct-select{margin-top:.5rem}
.correct-select label{font-size:.7rem;display:inline-flex;align-items:center;gap:.3rem;margin-right:.8rem;cursor:pointer}
.correct-select input[type=radio]{accent-color:var(--neon-green)}

.btn{padding:.5rem 1.2rem;border:none;border-radius:8px;font-family:inherit;font-weight:700;font-size:.8rem;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--neon-cyan);color:#060614}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--surface);color:var(--text-muted);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--neon-cyan)}
.btn-gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e}
.btn-block{width:100%}
.btn-row{display:flex;gap:.5rem;margin-top:1rem}

/* Quiz play */
.quiz-play{display:none}
.quiz-header{text-align:center;margin-bottom:1.5rem}
.quiz-progress{height:4px;background:var(--border);border-radius:4px;margin-bottom:1rem;overflow:hidden}
.quiz-progress-bar{height:100%;background:var(--neon-cyan);border-radius:4px;transition:width .4s ease}
.quiz-q-num{font-family:'Orbitron',monospace;font-size:.7rem;color:var(--text-dim);margin-bottom:.5rem}
.quiz-question{font-size:1.2rem;font-weight:700;margin-bottom:1.5rem;text-align:center;line-height:1.4}
.quiz-timer{font-family:'Orbitron',monospace;font-size:2rem;text-align:center;margin-bottom:1rem;transition:color .3s}
.quiz-timer.warning{color:#ff5252;animation:pulse .5s ease infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.5}}

.quiz-options{display:grid;gap:.6rem;max-width:500px;margin:0 auto}
.quiz-option{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:1rem;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;font-family:inherit;color:var(--text)}
.quiz-option:hover{border-color:var(--neon-cyan);transform:translateY(-2px)}
.quiz-option.selected{border-color:var(--neon-cyan);background:rgba(0,229,255,.1)}
.quiz-option.correct{border-color:var(--neon-green);background:rgba(57,255,20,.1);color:var(--neon-green)}
.quiz-option.wrong{border-color:#ff5252;background:rgba(255,82,82,.1);color:#ff5252}
.quiz-option.disabled{pointer-events:none;opacity:.6}

/* Results */
.quiz-results{display:none;text-align:center}
.results-title{font-family:'Orbitron',monospace;font-size:1.5rem;color:var(--gold);margin-bottom:1rem}
.results-score{font-size:3rem;font-family:'Orbitron',monospace;color:var(--neon-cyan);margin:.5rem 0}
.results-detail{color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem}
.results-list{text-align:left;max-width:500px;margin:0 auto 1.5rem}
.result-item{display:flex;align-items:center;gap:.5rem;padding:.5rem;border-bottom:1px solid var(--border);font-size:.8rem}
.result-item .ri-icon{width:20px;text-align:center}
.result-item .ri-correct{color:var(--neon-green)}
.result-item .ri-wrong{color:#ff5252}
</style>
</head>
<body>
<a href="/" class="back-link">← Volver a RAFLY</a>
<div class="container">
  <h1>🧠 TRIVIA QUIZ</h1>
  <p class="subtitle">Creá preguntas y sorteá entre quienes respondan correctamente</p>

  <!-- SETUP -->
  <div id="quizSetup">
    <div class="setup-card">
      <h2>Configuración</h2>
      <div class="field">
        <label>Nombre del quiz</label>
        <input type="text" id="quizName" placeholder="Ej: Trivia de la marca" value="Mi Trivia">
      </div>
      <div class="field">
        <label>Segundos por pregunta</label>
        <input type="number" id="quizTime" value="15" min="5" max="120" style="width:100px">
      </div>
    </div>

    <div id="questionsContainer">
      <!-- Questions added here -->
    </div>

    <button class="btn btn-secondary btn-block" id="addQuestionBtn" style="margin-bottom:1rem">+ Agregar pregunta</button>
    <button class="btn btn-primary btn-block" id="startQuizBtn" style="font-size:1rem;padding:.7rem">🚀 Iniciar Trivia</button>
  </div>

  <!-- PLAY -->
  <div class="quiz-play" id="quizPlay">
    <div class="quiz-progress"><div class="quiz-progress-bar" id="quizProgressBar"></div></div>
    <div class="quiz-q-num" id="quizQNum"></div>
    <div class="quiz-timer" id="quizTimer">15</div>
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="quiz-options" id="quizOptions"></div>
  </div>

  <!-- RESULTS -->
  <div class="quiz-results" id="quizResults">
    <div class="results-title">Resultados</div>
    <div class="results-score" id="resultsScore"></div>
    <div class="results-detail" id="resultsDetail"></div>
    <div class="results-list" id="resultsList"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-gold" id="copyResultsBtn">Copiar resultados</button>
      <button class="btn btn-primary" id="restartBtn">Nuevo quiz</button>
      <a href="/" class="btn btn-secondary" style="text-decoration:none">Volver al sorteo</a>
    </div>
  </div>
</div>

<script>
const questions = [];
let currentQ = 0, score = 0, timer = null, timeLeft = 0;
const answers = [];

function addQuestion() {
  const idx = questions.length;
  questions.push({ text: '', options: ['','','',''], correct: 0 });
  renderQuestions();
}

function removeQuestion(idx) {
  questions.splice(idx, 1);
  renderQuestions();
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = questions.map((q, i) => `
    <div class="question-block">
      <div class="q-num">Pregunta ${i + 1}</div>
      <button class="remove-q" onclick="removeQuestion(${i})">&times;</button>
      <div class="field">
        <input type="text" placeholder="Escribí la pregunta..." value="${q.text.replace(/"/g,'&quot;')}" onchange="questions[${i}].text=this.value">
      </div>
      <div class="options-grid">
        ${q.options.map((o, j) => `<input type="text" placeholder="Opción ${j+1}" value="${o.replace(/"/g,'&quot;')}" onchange="questions[${i}].options[${j}]=this.value">`).join('')}
      </div>
      <div class="correct-select">
        <span style="font-size:.7rem;color:var(--text-dim)">Respuesta correcta:</span>
        ${q.options.map((_, j) => `<label><input type="radio" name="correct${i}" ${q.correct===j?'checked':''} onchange="questions[${i}].correct=${j}"> ${j+1}</label>`).join('')}
      </div>
    </div>
  `).join('');
}

function startQuiz() {
  // Validate
  const valid = questions.filter(q => q.text.trim() && q.options.filter(o => o.trim()).length >= 2);
  if (valid.length === 0) return alert('Agregá al menos una pregunta con 2 opciones');

  currentQ = 0;
  score = 0;
  answers.length = 0;
  document.getElementById('quizSetup').style.display = 'none';
  document.getElementById('quizResults').style.display = 'none';
  document.getElementById('quizPlay').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  const q = questions[currentQ];
  const total = questions.length;
  const timePerQ = parseInt(document.getElementById('quizTime').value) || 15;

  document.getElementById('quizProgressBar').style.width = ((currentQ) / total * 100) + '%';
  document.getElementById('quizQNum').textContent = `Pregunta ${currentQ + 1} de ${total}`;
  document.getElementById('quizQuestion').textContent = q.text;
  document.getElementById('quizTimer').textContent = timePerQ;
  document.getElementById('quizTimer').className = 'quiz-timer';

  const optionsEl = document.getElementById('quizOptions');
  const validOpts = q.options.filter(o => o.trim());
  optionsEl.innerHTML = validOpts.map((o, i) => `<button class="quiz-option" data-idx="${i}" onclick="selectAnswer(${i})">${o}</button>`).join('');

  timeLeft = timePerQ;
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('quizTimer').textContent = timeLeft;
    if (timeLeft <= 5) document.getElementById('quizTimer').classList.add('warning');
    if (timeLeft <= 0) {
      clearInterval(timer);
      revealAnswer(-1); // Time's up
    }
  }, 1000);
}

function selectAnswer(idx) {
  clearInterval(timer);
  revealAnswer(idx);
}

function revealAnswer(selectedIdx) {
  const q = questions[currentQ];
  const btns = document.querySelectorAll('.quiz-option');

  btns.forEach(btn => {
    btn.classList.add('disabled');
    const bIdx = parseInt(btn.dataset.idx);
    if (bIdx === q.correct) btn.classList.add('correct');
    else if (bIdx === selectedIdx) btn.classList.add('wrong');
  });

  const isCorrect = selectedIdx === q.correct;
  if (isCorrect) score++;
  answers.push({ question: q.text, selected: selectedIdx >= 0 ? q.options[selectedIdx] : '(sin respuesta)', correct: q.options[q.correct], isCorrect });

  setTimeout(() => {
    currentQ++;
    if (currentQ < questions.length) {
      showQuestion();
    } else {
      showResults();
    }
  }, 1500);
}

function showResults() {
  document.getElementById('quizPlay').style.display = 'none';
  document.getElementById('quizResults').style.display = 'block';
  document.getElementById('quizProgressBar').style.width = '100%';

  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('resultsScore').textContent = `${score}/${questions.length}`;
  document.getElementById('resultsDetail').textContent = `${pct}% correctas — ${score === questions.length ? '¡Perfecto!' : score >= questions.length * 0.7 ? '¡Muy bien!' : 'Seguí practicando'}`;

  document.getElementById('resultsList').innerHTML = answers.map((a, i) => `
    <div class="result-item">
      <span class="ri-icon ${a.isCorrect ? 'ri-correct' : 'ri-wrong'}">${a.isCorrect ? '✓' : '✗'}</span>
      <span style="flex:1">${a.question}</span>
      <span style="font-size:.7rem;color:${a.isCorrect ? 'var(--neon-green)' : '#ff5252'}">${a.selected}</span>
    </div>
  `).join('');
}

function copyResults() {
  const name = document.getElementById('quizName').value || 'Trivia';
  let text = `🧠 ${name} — Resultados\n`;
  text += `Puntaje: ${score}/${questions.length} (${Math.round(score/questions.length*100)}%)\n\n`;
  answers.forEach((a, i) => {
    text += `${a.isCorrect ? '✅' : '❌'} ${a.question}\n   → ${a.selected}${!a.isCorrect ? ` (correcta: ${a.correct})` : ''}\n`;
  });
  text += `\n— Generado con RAFLY Trivia`;
  navigator.clipboard.writeText(text).catch(() => {});
  const btn = document.getElementById('copyResultsBtn');
  btn.textContent = '¡Copiado!';
  setTimeout(() => btn.textContent = 'Copiar resultados', 2000);
}

// Init
addQuestion();
addQuestion();
addQuestion();

document.getElementById('addQuestionBtn').addEventListener('click', addQuestion);
document.getElementById('startQuizBtn').addEventListener('click', startQuiz);
document.getElementById('copyResultsBtn').addEventListener('click', copyResults);
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('quizSetup').style.display = 'block';
  document.getElementById('quizResults').style.display = 'none';
});
</script>
</body>
</html>
